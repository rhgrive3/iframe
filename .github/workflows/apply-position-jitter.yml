name: Apply position jitter

on:
  push:
    paths:
      - .github/workflows/apply-position-jitter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch a.js
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('a.js')
          source = path.read_text()

          if "positionRandomEnabled" in source:
              print('Position jitter is already installed.')
          else:
              def replace_once(old, new):
                  global source
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f'Expected one match, got {count}: {old[:100]!r}')
                  source = source.replace(old, new, 1)

              replace_once(
                  "const STORAGE_KEY = '__fullscreen_iframe_autoclicker_state_v4__';",
                  "const STORAGE_KEY = '__fullscreen_iframe_autoclicker_state_v5__';"
              )
              replace_once(
                  "  const LEGACY_STORAGE_KEYS = [\n    '__fullscreen_iframe_autoclicker_state_v3__',",
                  "  const LEGACY_STORAGE_KEYS = [\n    '__fullscreen_iframe_autoclicker_state_v4__',\n    '__fullscreen_iframe_autoclicker_state_v3__',"
              )
              replace_once(
                  "  const DEFAULT_JITTER_MS = 100;\n",
                  "  const DEFAULT_JITTER_MS = 100;\n  const DEFAULT_POSITION_JITTER_PX = 2;\n  const MAX_POSITION_JITTER_PX = 30;\n"
              )

              old_ui = '''                <label class="field">
                  1区間のずれ幅（ms）
                  <input id="jitter" type="number" min="0" max="5000"
                    step="10" value="${DEFAULT_JITTER_MS}">
                </label>'''
              new_ui = old_ui + '''
                <label class="field inline">
                  <span>位置ランダム</span>
                  <input id="positionRandomEnabled" type="checkbox" checked>
                </label>
                <label class="field">
                  位置ずれ半径（px）
                  <input id="positionJitter" type="number" min="0"
                    max="${MAX_POSITION_JITTER_PX}" step="0.5"
                    value="${DEFAULT_POSITION_JITTER_PX}">
                </label>'''
              replace_once(old_ui, new_ui)

              replace_once(
                  "  const randomEnabledInput = $id('randomEnabled');\n  const jitterInput = $id('jitter');\n",
                  "  const randomEnabledInput = $id('randomEnabled');\n  const jitterInput = $id('jitter');\n  const positionRandomEnabledInput = $id('positionRandomEnabled');\n  const positionJitterInput = $id('positionJitter');\n"
              )
              replace_once(
                  "      version: 4,",
                  "      version: 5,"
              )
              replace_once(
                  "      randomEnabled: randomEnabledInput.checked,\n      jitterMs: jitterInput.value,\n",
                  "      randomEnabled: randomEnabledInput.checked,\n      jitterMs: jitterInput.value,\n      positionRandomEnabled: positionRandomEnabledInput.checked,\n      positionJitterPx: positionJitterInput.value,\n"
              )
              replace_once(
                  "    jitterInput.value = clamp(\n      Math.floor(Number(snapshot.jitterMs) || DEFAULT_JITTER_MS),\n      0,\n      5000\n    );\n",
                  "    jitterInput.value = clamp(\n      Math.floor(Number(snapshot.jitterMs) || DEFAULT_JITTER_MS),\n      0,\n      5000\n    );\n    positionRandomEnabledInput.checked = snapshot.positionRandomEnabled !== false;\n    positionJitterInput.value = clamp(\n      Number(snapshot.positionJitterPx) || DEFAULT_POSITION_JITTER_PX,\n      0,\n      MAX_POSITION_JITTER_PX\n    );\n"
              )
              replace_once(
                  "    jitterInput.disabled = locked;\n    recordModeSelect.disabled = locked;",
                  "    jitterInput.disabled = locked;\n    positionRandomEnabledInput.disabled = locked;\n    positionJitterInput.disabled = locked;\n    recordModeSelect.disabled = locked;"
              )

              helper = '''  function clickPositionJitter() {
    if (!positionRandomEnabledInput.checked) return { x: 0, y: 0 };
    const radius = clamp(
      Number(positionJitterInput.value) || 0,
      0,
      MAX_POSITION_JITTER_PX
    );
    if (radius <= 0) return { x: 0, y: 0 };

    const angle = Math.random() * Math.PI * 2;
    const distance = Math.sqrt(Math.random()) * radius;
    return {
      x: Math.cos(angle) * distance,
      y: Math.sin(angle) * distance
    };
  }

'''
              replace_once(
                  "  async function executePoint(point, token) {\n    const coords = clickCoordinates(point);\n    const hit = targetAtViewportPoint(coords.x, coords.y);",
                  helper + "  async function executePoint(point, token) {\n    const baseCoords = clickCoordinates(point);\n    const offset = clickPositionJitter();\n    const coords = {\n      x: clamp(\n        baseCoords.x + offset.x,\n        .5,\n        Math.max(.5, window.innerWidth - .5)\n      ),\n      y: clamp(\n        baseCoords.y + offset.y,\n        .5,\n        Math.max(.5, window.innerHeight - .5)\n      )\n    };\n    const hit = targetAtViewportPoint(coords.x, coords.y);"
              )
              replace_once(
                  "    randomEnabledInput,\n    jitterInput,\n    recordModeSelect",
                  "    randomEnabledInput,\n    jitterInput,\n    positionRandomEnabledInput,\n    positionJitterInput,\n    recordModeSelect"
              )
              replace_once(
                  "    jitterInput.value = clamp(\n      Math.floor(Number(jitterInput.value) || 0),\n      0,\n      5000\n    );\n    saveState();",
                  "    jitterInput.value = clamp(\n      Math.floor(Number(jitterInput.value) || 0),\n      0,\n      5000\n    );\n    positionJitterInput.value = clamp(\n      Number(positionJitterInput.value) || 0,\n      0,\n      MAX_POSITION_JITTER_PX\n    );\n    saveState();"
              )
              replace_once(
                  "completion({ ok: true, installed: true, version: 4 });",
                  "completion({ ok: true, installed: true, version: 5 });"
              )

              path.write_text(source)
          PY

      - name: Validate JavaScript
        run: node --check a.js

      - name: Commit result
        shell: bash
        run: |
          rm -f .github/workflows/apply-position-jitter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a.js .github/workflows/apply-position-jitter.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add randomized click position jitter"
          git push
