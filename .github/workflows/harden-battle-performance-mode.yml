name: Harden battle performance mode

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/patch-requests/battle-performance-hardening.txt'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: battle-performance-hardening-patch
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/battle-performance-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden battle performance runtime
        run: python3 .github/scripts/harden-battle-performance-mode.py

      - name: Validate
        shell: bash
        run: |
          node --check a.js
          mapfile -d '' test_files < <(find tests test -type f -name '*.test.mjs' -print0 2>/dev/null || true)
          if ((${#test_files[@]})); then
            node --test "${test_files[@]}"
          fi

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-battle-performance-mode.yml
          git rm .github/scripts/harden-battle-performance-mode.py
          git add a.js tests/autoflow.static.test.mjs
          git commit -m 'fix: scope and isolate battle performance hooks'
          git push origin HEAD:main
