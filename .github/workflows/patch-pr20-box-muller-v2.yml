name: Patch PR20 Box-Muller latency v2

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .pr20-box-muller-v2-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 20 && github.event.pull_request.head.ref == 'experiment/touch-events-scroll'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experiment/touch-events-scroll
          fetch-depth: 0

      - name: Integrate current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply touch and latency changes
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          path = Path('a.js')
          source = path.read_text(encoding='utf-8')

          if '  const APP_VERSION = 18;' not in source:
              source, count = re.subn(r'  const APP_VERSION = (?:16|17);', '  const APP_VERSION = 18;', source, count=1)
              if count != 1:
                  raise SystemExit(f'APP_VERSION replacement count: {count}')

          if 'TOUCH_VISIBLE_LATENCY_MS' not in source:
              timing_pattern = re.compile(
                  r'  const TOUCH_VISIBLE_WAIT_MIN_MS = 98;\n'
                  r'  const TOUCH_VISIBLE_WAIT_MAX_MS = 150;\n'
                  r'  const TOUCH_HOLD_MIN_MS = 65;\n'
                  r'  const TOUCH_HOLD_MAX_MS = 115;\n'
                  r'  const TOUCH_END_MAX_DRIFT_PX = 5;\n'
                  r'  const SCROLL_SPEED_MIN_PX_PER_SEC = 900;\n'
                  r'  const SCROLL_SPEED_MAX_PX_PER_SEC = 1800;\n'
              )
              timing_replacement = textwrap.indent(textwrap.dedent('''\
              const TOUCH_VISIBLE_LATENCY_MS = Object.freeze({ mean: 125, stdDev: 20, min: 70, max: 250 });
              const TOUCH_HOLD_LATENCY_MS = Object.freeze({ mean: 95, stdDev: 15, min: 50, max: 180 });
              const TOUCH_END_MAX_DRIFT_PX = 5;
              const SCROLL_SPEED_MIN_PX_PER_SEC = 900;
              const SCROLL_SPEED_MAX_PX_PER_SEC = 1800;

              function sampleClampedNormalMs({ mean, stdDev, min, max }, random = Math.random) {
                const meanValue = Number(mean);
                const stdDevValue = Number(stdDev);
                const minValue = Number(min);
                const maxValue = Number(max);
                if (![meanValue, stdDevValue, minValue, maxValue].every(Number.isFinite)
                  || stdDevValue < 0
                  || maxValue < minValue) {
                  throw new FlowError('正規分布レイテンシのパラメータが不正です', 'INVALID_NORMAL_LATENCY');
                }
                const u1 = Math.max(Number.MIN_VALUE, 1 - random());
                const u2 = 1 - random();
                const z0 = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
                return Math.round(clamp((z0 * stdDevValue) + meanValue, minValue, maxValue));
              }
              '''), '  ')
              source, count = timing_pattern.subn(timing_replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f'timing replacement count: {count}')

          if 'function makeTouchList(items)' in source:
              touch_pattern = re.compile(r'  function makeTouchList\(items\) \{.*?\n  function scrollableAncestors', re.S)
              touch_replacement = textwrap.indent(textwrap.dedent('''\
              function createSyntheticTouch(win, target, identifier, point) {
                if (typeof win.Touch !== 'function') {
                  throw new FlowError('この環境は標準Touchコンストラクタに対応していません', 'TOUCH_UNSUPPORTED');
                }
                const init = {
                  identifier,
                  target,
                  clientX: point.x,
                  clientY: point.y,
                  screenX: point.x + finite(win.screenX, 0),
                  screenY: point.y + finite(win.screenY, 0),
                  pageX: point.x + finite(win.scrollX, 0),
                  pageY: point.y + finite(win.scrollY, 0),
                  radiusX: randomUniform(1.2, 2.8),
                  radiusY: randomUniform(1.2, 2.8),
                  rotationAngle: randomUniform(-8, 8),
                  force: randomUniform(0.35, 0.75)
                };
                try {
                  return new win.Touch(init);
                } catch (error) {
                  throw new FlowError(`Touch生成に失敗しました: ${error.message}`, 'TOUCH_CONSTRUCTION_FAILED');
                }
              }

              function dispatchSyntheticTouch(win, target, type, touch, active) {
                if (typeof win.TouchEvent !== 'function') {
                  throw new FlowError('この環境は標準TouchEventに対応していません', 'TOUCH_EVENT_UNSUPPORTED');
                }
                const activeTouches = active ? [touch] : [];
                let event;
                try {
                  event = new win.TouchEvent(type, {
                    bubbles: true,
                    cancelable: true,
                    composed: true,
                    touches: activeTouches,
                    targetTouches: activeTouches,
                    changedTouches: [touch]
                  });
                } catch (error) {
                  throw new FlowError(`TouchEvent生成に失敗しました: ${error.message}`, 'TOUCH_EVENT_CONSTRUCTION_FAILED');
                }
                const accepted = target.dispatchEvent(event);
                if (!accepted || event.defaultPrevented) {
                  throw new FlowError(`${type}が対象側でキャンセルされました`, 'TOUCH_EVENT_CANCELED');
                }
                return event;
              }
              '''), '  ')
              source, count = touch_pattern.subn(touch_replacement + '\n  function scrollableAncestors', source, count=1)
              if count != 1:
                  raise SystemExit(f'touch replacement count: {count}')
          elif 'TOUCH_EVENT_CANCELED' not in source:
              raise SystemExit('touch implementation is neither old nor patched')

          if 'フルオート操作可能状態待ち' not in source:
              auto_pattern = re.compile(r'  async function ensureFullAuto\(config, context\) \{.*?\n  function elementDisplayOn', re.S)
              auto_replacement = textwrap.indent(textwrap.dedent('''\
              async function ensureFullAuto(config, context) {
                const { signal } = context;
                await waitForFrameReady({ signal, timeoutMs: config.timeoutSec * 1000, expectedScreen: 'battle' });
                const found = await monitorFrame(() => {
                  const doc = frameDocument();
                  const observed = fullAutoState(doc);
                  if (!observed.exists || !observed.visible) return false;
                  if (observed.on) return observed;

                  const attack = attackSnapshot(doc);
                  const attackReady = Boolean(
                    attack.start
                    && attack.start.classList.contains('display-on')
                    && !attack.start.classList.contains('display-off')
                    && computedVisible(attack.start)
                    && !attack.dummyVisible
                    && !attack.cancelVisible
                    && !attack.actorAttacking
                  );
                  return attackReady ? observed : false;
                }, {
                  signal,
                  timeoutMs: config.timeoutSec * 1000,
                  stableMs: DEFAULT_STABLE_MS,
                  description: 'フルオート操作可能状態待ち'
                });
                if (found.on) return { changed: false };
                await jqTapStrict(found.button, { signal, label: 'フルオート' });
                return { changed: true };
              }
              '''), '  ')
              source, count = auto_pattern.subn(auto_replacement + '\n  function elementDisplayOn', source, count=1)
              if count != 1:
                  raise SystemExit(f'full-auto replacement count: {count}')

          timing_calls = {
              'await abortableDelay(randomUniform(TOUCH_VISIBLE_WAIT_MIN_MS, TOUCH_VISIBLE_WAIT_MAX_MS), signal);': 'await abortableDelay(sampleClampedNormalMs(TOUCH_VISIBLE_LATENCY_MS), signal);',
              'await abortableDelay(randomUniform(TOUCH_HOLD_MIN_MS, TOUCH_HOLD_MAX_MS), signal);': 'await abortableDelay(sampleClampedNormalMs(TOUCH_HOLD_LATENCY_MS), signal);',
          }
          for old, new in timing_calls.items():
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f'missing timing call: {old}')

          path.write_text(source, encoding='utf-8')

      - name: Write regression tests and clean temporary branch files
        shell: bash
        run: |
          mkdir -p test
          cat > test/touch-event-regression.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';
          import vm from 'node:vm';

          const source = readFileSync(new URL('../a.js', import.meta.url), 'utf8');

          test('distribution script parses', () => assert.doesNotThrow(() => new vm.Script(source)));
          test('native touch lifecycle is enforced', () => {
            assert.match(source, /typeof win\.Touch !== 'function'/);
            assert.match(source, /typeof win\.TouchEvent !== 'function'/);
            assert.match(source, /dispatchSyntheticTouch\(win, dispatchTarget, 'touchstart'/);
            assert.match(source, /dispatchSyntheticTouch\(win, dispatchTarget, 'touchend'/);
            assert.match(source, /dispatchSyntheticTouch\(win, dispatchTarget, 'touchcancel'/);
            assert.match(source, /TOUCH_EVENT_CANCELED/);
            assert.doesNotMatch(source, /function makeTouchList\(/);
          });
          test('Box-Muller timing parameters match the requested model', () => {
            assert.match(source, /TOUCH_HOLD_LATENCY_MS = Object\.freeze\(\{ mean: 95, stdDev: 15, min: 50, max: 180 \}\)/);
            assert.match(source, /TOUCH_VISIBLE_LATENCY_MS = Object\.freeze\(\{ mean: 125, stdDev: 20, min: 70, max: 250 \}\)/);
            assert.match(source, /const z0 = Math\.sqrt\(-2 \* Math\.log\(u1\)\) \* Math\.cos\(2 \* Math\.PI \* u2\)/);
            assert.match(source, /\(z0 \* stdDevValue\) \+ meanValue/);
            assert.match(source, /abortableDelay\(sampleClampedNormalMs\(TOUCH_VISIBLE_LATENCY_MS\), signal\)/);
            assert.match(source, /abortableDelay\(sampleClampedNormalMs\(TOUCH_HOLD_LATENCY_MS\), signal\)/);
            assert.doesNotMatch(source, /TOUCH_(?:VISIBLE_WAIT|HOLD)_(?:MIN|MAX)_MS/);
          });
          test('full-auto waits for stable visible battle controls', () => {
            assert.match(source, /attack\.start\.classList\.contains\('display-on'\)/);
            assert.match(source, /computedVisible\(attack\.start\)/);
            assert.match(source, /!attack\.dummyVisible/);
            assert.match(source, /!attack\.cancelVisible/);
            assert.match(source, /!attack\.actorAttacking/);
            assert.match(source, /stableMs: DEFAULT_STABLE_MS/);
          });
          EOF

          rm -f \
            .github/workflows/apply-safe-touch-fixes.yml \
            .github/workflows/one-shot-normal-latency.yml \
            .github/workflows/patch-full-auto-readiness.yml \
            .github/workflows/pr-trigger-note.txt \
            .github/workflows/pr-trigger-note-2.txt \
            .github/workflows/pr-trigger-note-3.txt \
            .normal-latency-trigger \
            .normal-latency-pr20-trigger \
            .pr20-box-muller-v2-trigger

      - name: Verify
        run: |
          node --check a.js
          node --test test/touch-event-regression.test.mjs

      - name: Commit to experiment branch
        shell: bash
        run: |
          git add -A
          git commit -m 'refactor: use Box-Muller touch latency model'
          git push origin HEAD:experiment/touch-events-scroll
