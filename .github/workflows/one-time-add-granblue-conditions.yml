name: One-time add Granblue conditions

on:
  push:
    branches: [main]
    paths:
      - .trigger-granblue-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate a.js
        run: |
          python3 .github/scripts/add_granblue_conditions.py
          node --check a.js
          grep -q "gbf_full_auto_on" a.js
          grep -q "gbf_attack_off" a.js

      - name: Commit patch and remove one-time files
        run: |
          rm -f .trigger-granblue-patch
          rm -f .github/scripts/add_granblue_conditions.py
          rm -f .github/workflows/one-time-add-granblue-conditions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add Granblue battle state conditions"
          git push
