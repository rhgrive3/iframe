name: Run Granblue runtime state patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/patch-requests/runtime-state-v50-main.txt'

permissions:
  contents: write

concurrency:
  group: granblue-runtime-state-v50-runner
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: automation/runtime-state-v50
          fetch-depth: 0
          path: patch

      - name: Generate patch
        working-directory: patch
        run: python3 .github/scripts/harden-runtime-state.py

      - name: Validate patch
        working-directory: patch
        shell: bash
        run: |
          set -euo pipefail
          node --check a.js
          mapfile -d '' test_files < <(find tests test -type f -name '*.test.mjs' -print0 2>/dev/null || true)
          if ((${#test_files[@]})); then
            node --test "${test_files[@]}"
          fi

      - name: Commit patch branch
        working-directory: patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-runtime-state.yml
          git rm .github/scripts/harden-runtime-state.py
          git rm .github/patch-requests/runtime-state-v50.txt
          git add a.js tests/autoflow.static.test.mjs
          git diff --cached --check
          git commit -m 'fix: use Granblue runtime state for battle automation'
          git push origin HEAD:automation/runtime-state-v50

      - name: Check out main for cleanup
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: cleanup

      - name: Remove temporary patch infrastructure
        working-directory: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-runtime-state.yml
          git rm .github/scripts/harden-runtime-state.py
          git rm .github/workflows/run-runtime-state-patch.yml
          git rm .github/patch-requests/runtime-state-v50-main.txt
          git commit -m 'chore: remove temporary runtime state patch runner'
          git push origin HEAD:main
