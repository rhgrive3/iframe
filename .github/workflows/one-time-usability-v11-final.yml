name: One-time usability v11 final polish

on:
  push:
    branches:
      - ux/mobile-usability-v11
    paths:
      - .trigger-usability-v11-final

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final polish
        run: python3 .github/scripts/fix_usability_v11_final.py

      - name: Validate final source
        run: |
          node --check a.js
          grep -q "controls.minimize.setAttribute('aria-label',state.compact" a.js
          grep -q "controls.minimize.textContent='—'" a.js

      - name: Commit final source and remove one-time files
        run: |
          rm -f .trigger-usability-v11-final
          rm -f .github/scripts/fix_usability_v11_final.py
          rm -f .github/workflows/one-time-usability-v11-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep compact controls consistent after restore"
          git push
