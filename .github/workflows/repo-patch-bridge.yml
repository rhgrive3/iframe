name: Repository Patch Bridge

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-patch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[repo-patch]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bridge implementation
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse request
        id: request
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/repo-patch-parse.log) 2>&1
          printf '%s' "$ISSUE_BODY" > /tmp/repo-patch-body.txt
          cp .github/scripts/apply_repo_patch.py /tmp/apply_repo_patch.py
          python /tmp/apply_repo_patch.py parse \
            --body-file /tmp/repo-patch-body.txt \
            --request-file /tmp/repo-patch-request.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Apply, validate, commit, and push
        id: execute
        if: steps.request.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ steps.request.outputs.expected_head_sha }}
          COMMIT_MESSAGE: ${{ steps.request.outputs.commit_message }}
          VALIDATION: ${{ steps.request.outputs.validation }}
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/repo-patch.log) 2>&1

          git check-ref-format --branch "$TARGET_BRANCH"
          git fetch --no-tags origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git checkout --detach "refs/remotes/origin/${TARGET_BRANCH}"

          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "stale request: expected $EXPECTED_HEAD_SHA, current $actual_head"
            exit 1
          fi

          python /tmp/apply_repo_patch.py apply \
            --request-file /tmp/repo-patch-request.json \
            --repo-root "$GITHUB_WORKSPACE"

          git diff --check
          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'request produced no repository changes'
            exit 1
          fi

          case "$VALIDATION" in
            none)
              ;;
            autoflow)
              node --check a.js
              node --test \
                tests/autoflow.static.test.mjs \
                test/touch-event-regression.test.mjs
              ;;
            *)
              echo "unsupported validation profile: $VALIDATION"
              exit 1
              ;;
          esac

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "$COMMIT_MESSAGE"
          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "new_head=$new_head" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        uses: actions/github-script@v8
        env:
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          NEW_HEAD: ${{ steps.execute.outputs.new_head }}
        with:
          script: |
            const fs = require('fs');
            const succeeded = process.env.REQUEST_OUTCOME === 'success' && process.env.EXECUTE_OUTCOME === 'success';
            const apiHeaders = {
              accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2026-03-10'
            };
            let log = '';
            for (const path of ['/tmp/repo-patch-parse.log', '/tmp/repo-patch.log']) {
              try {
                const part = fs.readFileSync(path, 'utf8');
                if (part) log += `${part}\n`;
              } catch {}
            }
            if (log.length > 45000) log = log.slice(-45000);
            const summary = succeeded
              ? `Repository patch applied successfully. New head: \`${process.env.NEW_HEAD}\``
              : 'Repository patch failed. The target branch was not updated.';
            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/comments', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${summary}\n\n<details><summary>Execution log</summary>\n\n\`\`\`text\n${log}\n\`\`\`\n</details>`,
              headers: apiHeaders
            });
            if (succeeded) {
              await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed',
                headers: apiHeaders
              });
            }

      - name: Fail workflow when patch failed
        if: steps.request.outcome != 'success' || steps.execute.outcome != 'success'
        run: exit 1

  rebase_selectable_button:
    if: github.actor == github.repository_owner && github.event.issue.title == '[automation] rebase selectable button branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: automation/selectable-button-block-v63
          fetch-depth: 0

      - name: Merge latest main, resolve known conflicts, and validate
        id: merge
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/selectable-rebase.log) 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          merge_failed=0
          git merge --no-edit origin/main || merge_failed=1
          if (( merge_failed )); then
            python3 - <<'PY'
          from pathlib import Path

          path = Path('a.js')
          text = path.read_text()
          resolved = []
          cursor = 0
          while True:
              start = text.find('<<<<<<< HEAD\n', cursor)
              if start < 0:
                  break
              middle = text.find('=======\n', start)
              end = text.find('>>>>>>> origin/main\n', middle)
              if middle < 0 or end < 0:
                  raise SystemExit('malformed merge conflict markers')
              ours = text[start + len('<<<<<<< HEAD\n'):middle]
              theirs = text[middle + len('=======\n'):end]
              if 'iframeTapElement' in ours and 'parentTabRestart' in theirs and 'blockListGuaranteesYield' not in ours:
                  replacement = "      if (['fixedWait', 'randomWait', 'watch', 'iframeTapElement', 'iframeReload', 'iframeBack', 'iframeRoute', 'iframeReady', 'parentTabRestart'].includes(block.type)) return true;\n"
              elif 'async function startWorkflow()' in ours and 'async function startWorkflow(resumeHandoff = null)' in theirs:
                  replacement = theirs.replace(
                      'if (state.running || state.legacyRunning) return;',
                      'if (state.running || state.legacyRunning || state.elementPicker) return;',
                      1
                  )
              else:
                  raise SystemExit(f'unexpected a.js conflict:\nOURS:\n{ours}\nTHEIRS:\n{theirs}')
              text = text[:start] + replacement + text[end + len('>>>>>>> origin/main\n'):]
              resolved.append(replacement.splitlines()[0])
              cursor = start + len(replacement)
          if not resolved:
              raise SystemExit('no expected a.js conflicts were resolved')
          if any(marker in text for marker in ('<<<<<<<', '=======', '>>>>>>>')):
              raise SystemExit('unresolved conflict marker remains in a.js')
          path.write_text(text)
          print('Resolved conflicts:')
          for item in resolved:
              print('-', item)
          PY
            git add -A
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'unresolved files remain:'
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi
          node --check a.js
          node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs
          git push origin HEAD:automation/selectable-button-block-v63
          echo "new_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report selectable rebase
        if: always()
        uses: actions/github-script@v8
        env:
          OUTCOME: ${{ steps.merge.outcome }}
          NEW_HEAD: ${{ steps.merge.outputs.new_head }}
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/selectable-rebase.log', 'utf8'); } catch {}
            if (log.length > 45000) log = log.slice(-45000);
            const success = process.env.OUTCOME === 'success';
            const summary = success
              ? `Selectable button branch rebased successfully. New head: \`${process.env.NEW_HEAD}\``
              : 'Selectable button branch rebase failed.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${summary}\n\n<details><summary>Execution log</summary>\n\n\`\`\`text\n${log}\n\`\`\`\n</details>`
            });
            if (success) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

      - name: Fail when rebase failed
        if: steps.merge.outcome != 'success'
        run: exit 1
