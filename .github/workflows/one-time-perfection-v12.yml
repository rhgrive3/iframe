name: One-time Auto Flow v12 perfection

on:
  push:
    branches: [ux/perfection-v12]
    paths:
      - .trigger-perfection-v12
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'ux/perfection-v12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/perfection-v12
          fetch-depth: 0

      - name: Prepare scoped patch
        run: python3 .github/scripts/fix_perfection_v12.py

      - name: Apply v12 usability overhaul
        run: python3 .github/scripts/perfection_v12.py

      - name: Validate syntax and UX invariants
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs
          grep -q "state_v12" a.js
          grep -q "data-dock-position" a.js
          grep -q "className='emptyFlow'" a.js

      - name: Commit product changes and remove one-time machinery
        run: |
          rm -f .trigger-perfection-v12
          rm -f .github/scripts/fix_perfection_v12.py
          rm -f .github/scripts/perfection_v12.py
          rm -f .github/workflows/one-time-perfection-v12.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: complete v12 usability overhaul"
          git push origin HEAD:ux/perfection-v12
