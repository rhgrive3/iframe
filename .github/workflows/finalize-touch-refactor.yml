name: Finalize touch scroll refactor

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: finalize-touch-scroll-refactor
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.ref == 'refactor/truncated-touch-scroll-sync' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' &&
       github.event.issue.title == 'run-truncated-touch-scroll-refactor-debug-20260730')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/truncated-touch-scroll-sync
          fetch-depth: 0
      - name: Report start
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "touch refactor finalizer started at $(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact refactor
        id: apply
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python .github/scripts/apply_touch_refactor.py > /tmp/apply.log 2>&1
          status=$?
          cat /tmp/apply.log
          if [ "$status" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "issues" ]; then
              gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/apply.log
            fi
            exit "$status"
          fi
      - name: Validate
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs
      - name: Commit to pull request branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: synchronize synthetic touch and scroll physics'
          git push origin HEAD:refactor/truncated-touch-scroll-sync
      - name: Report completion
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "touch refactor finalizer completed at $(git rev-parse HEAD)"
