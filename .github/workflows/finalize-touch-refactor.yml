name: Finalize touch scroll refactor

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: finalize-touch-scroll-refactor
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.ref == 'refactor/truncated-touch-scroll-sync' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 28 &&
       github.event.comment.body == '/apply-touch-refactor')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/truncated-touch-scroll-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact refactor
        run: python .github/scripts/apply_touch_refactor.py
      - name: Validate
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs
      - name: Commit to pull request branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: synchronize synthetic touch and scroll physics'
          git push origin HEAD:refactor/truncated-touch-scroll-sync
