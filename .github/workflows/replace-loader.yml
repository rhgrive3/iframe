name: Replace compressed loader

on:
  push:
    branches: [main]
    paths:
      - .fix-plain-loader

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand embedded source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const wrapper = fs.readFileSync('a.js', 'utf8');
          const start = wrapper.indexOf('const payload =');
          const end = wrapper.indexOf('const bytes =', start);
          if (start < 0 || end < 0) throw new Error('payload block not found');
          const block = wrapper.slice(start, end);
          const parts = [...block.matchAll(/'([A-Za-z0-9+/=]+)'/g)].map(m => m[1]);
          if (!parts.length) throw new Error('payload chunks not found');
          const source = zlib.gunzipSync(Buffer.from(parts.join(''), 'base64')).toString('utf8');
          if (!source.startsWith('(() => {') || !source.includes('version:8')) {
            throw new Error('expanded source validation failed');
          }
          fs.writeFileSync('a.js', source);
          NODE
          node --check a.js
      - name: Commit direct script
        run: |
          rm -f .fix-plain-loader .github/workflows/replace-loader.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Replace compressed loader with direct script"
          git push
