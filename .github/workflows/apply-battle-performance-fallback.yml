name: Apply battle performance iframe fallback

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/patch-requests/battle-performance-fallback.txt'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: battle-performance-fallback-patch
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/battle-performance-fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply same-origin iframe bootstrap fallback
        run: python3 .github/scripts/apply-battle-performance-fallback.py

      - name: Validate
        shell: bash
        run: |
          node --check a.js
          mapfile -d '' test_files < <(find tests test -type f -name '*.test.mjs' -print0 2>/dev/null || true)
          if ((${#test_files[@]})); then
            node --test "${test_files[@]}"
          fi

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-battle-performance-fallback.yml
          git rm .github/scripts/apply-battle-performance-fallback.py
          git add a.js tests/autoflow.static.test.mjs
          git commit -m 'fix: bootstrap battle performance mode in child iframe'
          git push origin HEAD:main
