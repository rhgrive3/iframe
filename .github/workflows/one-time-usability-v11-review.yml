name: One-time usability v11 review fixes

on:
  push:
    branches:
      - ux/mobile-usability-v11
    paths:
      - .trigger-usability-v11-review

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply review fixes
        run: python3 .github/scripts/fix_usability_v11_review.py

      - name: Validate reviewed source
        run: |
          node --check a.js
          grep -q "height:var(--dock-height)!important" a.js
          grep -q "active===urlInput" a.js
          grep -q "viewport-aware" .github/scripts/fix_usability_v11_review.py
          grep -q "aria-label=\"メニューを移動" a.js

      - name: Commit reviewed source and remove one-time files
        run: |
          rm -f .trigger-usability-v11-review
          rm -f .github/scripts/fix_usability_v11_review.py
          rm -f .github/workflows/one-time-usability-v11-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden mobile keyboard and viewport behavior"
          git push
