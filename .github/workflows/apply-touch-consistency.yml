name: Apply synthetic touch consistency fixes

on:
  push:
    branches: [experiment/touch-event-consistency]
    paths: [.github/workflows/apply-touch-consistency.yml]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-touch-consistency
  cancel-in-progress: false

jobs:
  patch:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'experiment/touch-event-consistency'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experiment/touch-event-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('a.js')
          source = path.read_text(encoding='utf-8')

          source, version_count = re.subn(r"  const APP_VERSION = 18;", "  const APP_VERSION = 19;", source, count=1)
          if version_count != 1:
              raise SystemExit(f'APP_VERSION replacement count: {version_count}')

          old_constants = """  const TOUCH_VISIBLE_LATENCY_MS = Object.freeze({ mean: 125, stdDev: 20, min: 70, max: 250 });
          const TOUCH_HOLD_LATENCY_MS = Object.freeze({ mean: 95, stdDev: 15, min: 50, max: 180 });
          const TOUCH_END_MAX_DRIFT_PX = 5;
          const SCROLL_SPEED_MIN_PX_PER_SEC = 900;
          const SCROLL_SPEED_MAX_PX_PER_SEC = 1800;
          """
          new_constants = """  const TOUCH_VISIBLE_LATENCY_MS = Object.freeze({ mean: 130, stdDev: 20, min: 80, max: 250 });
          const TOUCH_HOLD_LATENCY_MS = Object.freeze({ mean: 95, stdDev: 15, min: 50, max: 180 });
          const TOUCH_START_STDDEV_RATIO_MIN = 0.12;
          const TOUCH_START_STDDEV_RATIO_MAX = 0.15;
          const TOUCH_DRIFT_STDDEV_RATIO = 0.012;
          const TOUCH_DRIFT_STDDEV_MIN_PX = 0.35;
          const TOUCH_DRIFT_STDDEV_MAX_PX = 3;
          const TOUCH_MOVE_THRESHOLD_PX = 0.1;
          const SCROLL_SPEED_MIN_PX_PER_SEC = 900;
          const SCROLL_SPEED_MAX_PX_PER_SEC = 1800;
          """
          if source.count(old_constants) != 1:
              raise SystemExit('touch constants changed concurrently')
          source = source.replace(old_constants, new_constants, 1)

          old_sampler = """    const u1 = Math.max(Number.MIN_VALUE, 1 - random());
            const u2 = 1 - random();
            const z0 = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
            return Math.round(clamp((z0 * stdDevValue) + meanValue, minValue, maxValue));
          }
          """
          new_sampler = """    return Math.round(clamp(
              (sampleStandardNormal(random) * stdDevValue) + meanValue,
              minValue,
              maxValue
            ));
          }

          function sampleStandardNormal(random = Math.random) {
            const u1 = Math.max(Number.MIN_VALUE, 1 - random());
            const u2 = 1 - random();
            return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
          }
          """
          if source.count(old_sampler) != 1:
              raise SystemExit('normal sampler changed concurrently')
          source = source.replace(old_sampler, new_sampler, 1)

          physical = """      pageY: point.y + finite(win.scrollY, 0),
            radiusX: randomUniform(1.2, 2.8),
            radiusY: randomUniform(1.2, 2.8),
            rotationAngle: randomUniform(-8, 8),
            force: randomUniform(0.35, 0.75)
          """
          if source.count(physical) != 1:
              raise SystemExit('touch physical attributes changed concurrently')
          source = source.replace(physical, "      pageY: point.y + finite(win.scrollY, 0)\n", 1)

          old_point = """  function pointForTarget(target, fractions) {
            const rect = target.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) {
              throw new FlowError('押下対象の大きさを取得できません', 'TARGET_HAS_NO_AREA');
            }
            return {
              rect,
              x: rect.left + (rect.width * fractions.x),
              y: rect.top + (rect.height * fractions.y)
            };
          }
          """
          new_point = """  function pointForTarget(target, fractions) {
            const rect = target.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) {
              throw new FlowError('押下対象の大きさを取得できません', 'TARGET_HAS_NO_AREA');
            }
            const insetX = Math.min(0.01, rect.width / 2);
            const insetY = Math.min(0.01, rect.height / 2);
            return {
              rect,
              x: clamp(rect.left + (rect.width * fractions.x), rect.left + insetX, rect.right - insetX),
              y: clamp(rect.top + (rect.height * fractions.y), rect.top + insetY, rect.bottom - insetY)
            };
          }
          """
          if source.count(old_point) != 1:
              raise SystemExit('pointForTarget changed concurrently')
          source = source.replace(old_point, new_point, 1)

          old_end = """  function randomEndPoint(start, rect) {
            const angle = randomUniform(0, Math.PI * 2);
            const radius = Math.sqrt(Math.random()) * TOUCH_END_MAX_DRIFT_PX;
            const epsilon = 0.01;
            return {
              x: clamp(start.x + (Math.cos(angle) * radius), rect.left + epsilon, rect.right - epsilon),
              y: clamp(start.y + (Math.sin(angle) * radius), rect.top + epsilon, rect.bottom - epsilon)
            };
          }
          """
          new_end = """  function sampleTouchStartFractions(random = Math.random) {
            const stdDevRatio = randomUniform(
              TOUCH_START_STDDEV_RATIO_MIN,
              TOUCH_START_STDDEV_RATIO_MAX,
              random
            );
            return {
              x: clamp(0.5 + (sampleStandardNormal(random) * stdDevRatio), 0, 1),
              y: clamp(0.5 + (sampleStandardNormal(random) * stdDevRatio), 0, 1)
            };
          }

          function sampleTouchEndPoint(start, rect, random = Math.random) {
            const stdDev = clamp(
              Math.min(rect.width, rect.height) * TOUCH_DRIFT_STDDEV_RATIO,
              TOUCH_DRIFT_STDDEV_MIN_PX,
              TOUCH_DRIFT_STDDEV_MAX_PX
            );
            const insetX = Math.min(0.01, rect.width / 2);
            const insetY = Math.min(0.01, rect.height / 2);
            return {
              x: clamp(start.x + (sampleStandardNormal(random) * stdDev), rect.left + insetX, rect.right - insetX),
              y: clamp(start.y + (sampleStandardNormal(random) * stdDev), rect.top + insetY, rect.bottom - insetY)
            };
          }

          function interpolateTouchPoint(start, end, progress) {
            return {
              x: start.x + ((end.x - start.x) * progress),
              y: start.y + ((end.y - start.y) * progress)
            };
          }
          """
          if source.count(old_end) != 1:
              raise SystemExit('end-point helper changed concurrently')
          source = source.replace(old_end, new_end, 1)

          if source.count('        const fractions = { x: Math.random(), y: Math.random() };') != 1:
              raise SystemExit('start-coordinate logic changed concurrently')
          source = source.replace('        const fractions = { x: Math.random(), y: Math.random() };', '        const fractions = sampleTouchStartFractions();', 1)
          source = source.replace('`${targetLabel}のランダム座標が他要素に遮られています`', '`${targetLabel}のガウス座標が他要素に遮られています`', 1)

          old_lifecycle = """        await abortableDelay(sampleClampedNormalMs(TOUCH_HOLD_LATENCY_MS), signal);
            const endPoint = randomEndPoint(start, start.rect);
            activePoint = endPoint;
            const endTouch = createSyntheticTouch(win, dispatchTarget, identifier, endPoint);
            dispatchSyntheticTouch(win, dispatchTarget, 'touchend', endTouch, false);
          """
          new_lifecycle = """        const holdDuration = sampleClampedNormalMs(TOUCH_HOLD_LATENCY_MS);
            const endPoint = sampleTouchEndPoint(start, start.rect);
            const movement = Math.hypot(endPoint.x - start.x, endPoint.y - start.y);
            if (movement >= TOUCH_MOVE_THRESHOLD_PX) {
              const moveProgress = randomUniform(0.4, 0.7);
              await abortableDelay(holdDuration * moveProgress, signal);
              const movePoint = interpolateTouchPoint(start, endPoint, moveProgress);
              activePoint = movePoint;
              const moveTouch = createSyntheticTouch(win, dispatchTarget, identifier, movePoint);
              dispatchSyntheticTouch(win, dispatchTarget, 'touchmove', moveTouch, true);
              await abortableDelay(holdDuration * (1 - moveProgress), signal);
            } else {
              await abortableDelay(holdDuration, signal);
            }
            activePoint = endPoint;
            const endTouch = createSyntheticTouch(win, dispatchTarget, identifier, endPoint);
            dispatchSyntheticTouch(win, dispatchTarget, 'touchend', endTouch, false);
          """
          if source.count(old_lifecycle) != 1:
              raise SystemExit('touch lifecycle changed concurrently')
          source = source.replace(old_lifecycle, new_lifecycle, 1)

          old_uniform = """  function randomUniform(min, max) {
            const a = finite(min, 0);
            const b = finite(max, 0);
            if (b < a) throw new FlowError('ランダム待機の最大値が最小値未満です', 'INVALID_RANGE');
            return a + Math.random() * (b - a);
          }
          """
          new_uniform = """  function randomUniform(min, max, random = Math.random) {
            const a = finite(min, 0);
            const b = finite(max, 0);
            if (b < a) throw new FlowError('ランダム待機の最大値が最小値未満です', 'INVALID_RANGE');
            return a + random() * (b - a);
          }
          """
          if source.count(old_uniform) != 1:
              raise SystemExit('randomUniform changed concurrently')
          source = source.replace(old_uniform, new_uniform, 1)
          path.write_text(source, encoding='utf-8')

      - name: Update regression coverage
        shell: bash
        run: |
          cat > test/touch-event-regression.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';
          import vm from 'node:vm';

          const source = readFileSync(new URL('../a.js', import.meta.url), 'utf8');
          test('script parses', () => assert.doesNotThrow(() => new vm.Script(source)));
          test('visible wait matches the requested normal distribution', () => {
            assert.match(source, /TOUCH_VISIBLE_LATENCY_MS = Object\.freeze\(\{ mean: 130, stdDev: 20, min: 80, max: 250 \}\)/);
            assert.match(source, /abortableDelay\(sampleClampedNormalMs\(TOUCH_VISIBLE_LATENCY_MS\), signal\)/);
          });
          test('start point is a clamped center-biased 2D Gaussian sample', () => {
            assert.match(source, /TOUCH_START_STDDEV_RATIO_MIN = 0\.12/);
            assert.match(source, /TOUCH_START_STDDEV_RATIO_MAX = 0\.15/);
            assert.match(source, /x: clamp\(0\.5 \+ \(sampleStandardNormal\(random\) \* stdDevRatio\), 0, 1\)/);
            assert.match(source, /y: clamp\(0\.5 \+ \(sampleStandardNormal\(random\) \* stdDevRatio\), 0, 1\)/);
            assert.doesNotMatch(source, /fractions = \{ x: Math\.random\(\), y: Math\.random\(\) \}/);
          });
          test('movement emits touchmove before touchend', () => {
            const move = source.indexOf("dispatchSyntheticTouch(win, dispatchTarget, 'touchmove'");
            const end = source.indexOf("dispatchSyntheticTouch(win, dispatchTarget, 'touchend'");
            assert.ok(move >= 0 && end > move);
            assert.match(source, /movement >= TOUCH_MOVE_THRESHOLD_PX/);
            assert.doesNotMatch(source, /TOUCH_END_MAX_DRIFT_PX/);
          });
          test('optional physical attributes are not independently resampled', () => {
            const start = source.indexOf('function createSyntheticTouch');
            const end = source.indexOf('function dispatchSyntheticTouch', start);
            const body = source.slice(start, end);
            assert.doesNotMatch(body, /radiusX|radiusY|rotationAngle|force/);
          });
          test('TouchEvent lists remain coherent', () => {
            assert.match(source, /const activeTouches = active \? \[touch\] : \[\]/);
            assert.match(source, /touches: activeTouches/);
            assert.match(source, /targetTouches: activeTouches/);
            assert.match(source, /changedTouches: \[touch\]/);
            assert.match(source, /'touchcancel', cancelTouch, false/);
          });
          EOF

      - name: Make validator cover touch tests
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/validate-autoflow.yml')
          source = path.read_text(encoding='utf-8')
          source = source.replace('      - tests/**\n      - .github/workflows/validate-autoflow.yml', '      - test/**\n      - tests/**\n      - .github/workflows/validate-autoflow.yml')
          source = source.replace('        run: node --test tests/autoflow.static.test.mjs', '        run: node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs')
          path.write_text(source, encoding='utf-8')

      - name: Verify and commit
        shell: bash
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs
          rm .github/workflows/apply-touch-consistency.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make synthetic touch gestures statistically coherent'
          git push origin HEAD:experiment/touch-event-consistency
