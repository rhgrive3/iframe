name: Apply professional UX patch in PR

on:
  push:
    branches:
      - 'ux/professional-controller'
    paths:
      - '.github/workflows/apply-professional-ux-pr.yml'
      - 'tests/safari-performance-regression.test.mjs'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-professional-ux-pr.yml'
      - 'tools/apply-professional-ux.py'
      - 'tests/safari-performance-regression.test.mjs'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/professional-controller
          fetch-depth: 0

      - name: Apply UX patch
        run: python3 tools/apply-professional-ux.py

      - name: Validate
        shell: bash
        run: |
          node --check a.js
          mapfile -d '' test_files < <(find tests test -type f -name '*.test.mjs' -print0 2>/dev/null || true)
          if ((${#test_files[@]})); then
            node --test "${test_files[@]}"
          fi

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a.js tests/autoflow.static.test.mjs tests/safari-performance-regression.test.mjs
          git rm .github/workflows/apply-professional-ux-pr.yml tools/apply-professional-ux.py
          git commit -m 'feat: professionalize controller UX'
          git push origin HEAD:ux/professional-controller
