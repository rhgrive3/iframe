name: One-time Auto Flow v12 final polish

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ux/perfection-v12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ux/perfection-v12
          fetch-depth: 0

      - name: Apply final polish
        run: python3 .github/scripts/v12_final_polish.py

      - name: Validate final product
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs

      - name: Commit and remove one-time files
        run: |
          rm -f .github/scripts/v12_final_polish.py
          rm -f .github/workflows/one-time-v12-final-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finish v12 responsive and focus polish"
          git push origin HEAD:ux/perfection-v12
