name: Fix stale battle runtime redirect

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/patch-requests/fix-stale-battle-runtime-redirect.txt'

permissions:
  contents: write

concurrency:
  group: fix-stale-battle-runtime-redirect
  cancel-in-progress: false

jobs:
  patch-main:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded battle runtime patch
        run: python3 .github/scripts/fix_stale_battle_runtime_redirect.py

      - name: Validate all JavaScript regressions
        run: |
          node --check a.js
          for test_file in tests/*.test.mjs; do
            node --test "$test_file"
          done

      - name: Commit hotfix directly to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-stale-battle-runtime-redirect.yml
          git rm .github/scripts/fix_stale_battle_runtime_redirect.py
          git add a.js tests/autoflow.static.test.mjs
          git commit -m "fix: ignore stale battle end state before full auto"
          git push origin HEAD:main
