name: Fix battle control render scope

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/patch-requests/fix-battle-control-render-scope.txt'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-battle-control-render-scope
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/fix-battle-control-render-scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restrict battle control rendering
        run: python3 .github/scripts/fix-battle-control-render-scope.py

      - name: Validate
        shell: bash
        run: |
          node --check a.js
          mapfile -d '' test_files < <(find tests test -type f -name '*.test.mjs' -print0 2>/dev/null || true)
          if ((${#test_files[@]})); then
            node --test "${test_files[@]}"
          fi

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-battle-control-render-scope.yml
          git rm .github/scripts/fix-battle-control-render-scope.py
          git add a.js tests/autoflow.static.test.mjs
          git commit -m 'fix: prevent enemy rendering in lightweight battle mode'
          git push origin HEAD:main
