name: One-time Granblue assistant follow-up

on:
  push:
    branches: [feature/granblue-condition-assistant]
    paths:
      - .trigger-granblue-assistant-followup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/granblue-condition-assistant
          fetch-depth: 0
      - name: Apply safety and selector fixes
        run: python3 .github/scripts/granblue_assistant_followup.py
      - name: Validate final product
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs
          grep -q 'if (window.top !== window) return;' a.js
          grep -q "conditionSelector.value=preset.startsWith('gbf_full_auto_')?'.btn-auto':'.btn-attack-start'" a.js
      - name: Commit and remove one-time files
        run: |
          rm -f .trigger-granblue-assistant-followup
          rm -f .github/scripts/granblue_assistant_followup.py
          rm -f .github/workflows/one-time-granblue-assistant-followup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden Granblue assistant startup and presets"
          git push
