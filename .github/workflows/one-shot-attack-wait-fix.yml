name: One-shot attack wait fix

on:
  push:
    branches:
      - fix/attack-wait-detect-running-character

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attack-wait-detect-running-character
      - name: Patch attack-start detection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('a.js')
          source = path.read_text()

          replacements = [
              (
                  "    attackCancel: '.btn-attack-cancel',\n    turn: '#js-turn-num-count'",
                  "    attackCancel: '.btn-attack-cancel',\n    attackActor: '.prt-command .btn-command-character.attack',\n    turn: '#js-turn-num-count'",
              ),
              (
                  "      cancelVisible: elementDisplayOn(cancel),\n      turn: turnSignature(doc)",
                  "      cancelVisible: elementDisplayOn(cancel),\n      actorAttacking: Boolean(doc.querySelector(SELECTORS.attackActor)),\n      turn: turnSignature(doc)",
              ),
              (
                  "    return Boolean(snapshot.cancelVisible || snapshot.dummyVisible);",
                  "    return Boolean(snapshot.cancelVisible || snapshot.dummyVisible || snapshot.actorAttacking);",
              ),
              (
                  "      const started = current.cancelVisible || current.dummyVisible || startReplaced || startBecameHidden || turnChanged;",
                  "      const started = current.cancelVisible || current.dummyVisible || current.actorAttacking || startReplaced || startBecameHidden || turnChanged;",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one target, found {count}: {old!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Verify regression
        run: |
          node --check a.js
          node <<'NODE'
          const assert = require('node:assert/strict');
          const isAttackInProgress = snapshot => Boolean(
            snapshot.cancelVisible || snapshot.dummyVisible || snapshot.actorAttacking
          );
          assert.equal(isAttackInProgress({ cancelVisible: false, dummyVisible: false, actorAttacking: true }), true);
          assert.equal(isAttackInProgress({ cancelVisible: false, dummyVisible: false, actorAttacking: false }), false);
          NODE
          grep -Fq "attackActor: '.prt-command .btn-command-character.attack'" a.js
          grep -Fq 'current.actorAttacking || startReplaced' a.js
      - name: Commit verified fix and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a.js
          git rm .github/workflows/one-shot-attack-wait-fix.yml
          git commit -m 'fix: detect attack animation in attack wait block'
          git push origin HEAD:fix/attack-wait-detect-running-character
