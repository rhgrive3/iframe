name: One-shot full-auto fix

on:
  schedule:
    - cron: '48 15 29 7 *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch a.js
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('a.js')
          source = path.read_text()
          old = """    const waitOn = monitorFrame(() => {
      const observed = fullAutoState();
      return observed.exists && observed.visible && observed.on ? observed : false;
    }, { signal, timeoutMs: config.timeoutSec * 1000, stableMs: 50, description: 'フルオートON待ち' });
    await jqTapStrict(found.button, { signal, label: 'フルオート' });
    await waitOn;
    return { changed: true };"""
          new = """    await jqTapStrict(found.button, { signal, label: 'フルオート' });
    return { changed: true };"""
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Verify and remove runner
        run: |
          node --check a.js
          ! grep -q "フルオートON待ち" a.js
          rm .github/workflows/one-shot-full-auto-fix.yml
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: let full-auto block continue after tap'
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close 13 --comment 'Hotfix applied and one-shot workflow removed.'
