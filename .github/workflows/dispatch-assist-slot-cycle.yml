name: Dispatch assist slot cycle patch

on:
  push:
    branches: [main]
    paths:
      - .github/assist-slot-main.trigger
      - .github/workflows/dispatch-assist-slot-cycle.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: trigger assist slot dispatcher'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/assist-slot-cycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch to feature branch
        run: python scripts/patch_assist_slot_cycle.py
      - name: Validate feature branch
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs
      - name: Commit feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: cycle selected assist slots and clear notified results'
          git push origin HEAD:feature/assist-slot-cycle
      - name: Remove one-shot dispatcher from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/dispatch-assist-slot-cycle.yml .github/assist-slot-main.trigger
          git add -A
          git commit -m 'chore: remove one-shot assist slot dispatcher'
          git push origin HEAD:main
