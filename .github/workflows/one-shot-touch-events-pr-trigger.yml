name: Trigger touch-event experiment from draft PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'experiment/touch-events-scroll' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/touch-events-scroll
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch definition
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/one-shot-touch-events-experiment.yml').read_text(encoding='utf-8')
          step = source.index('      - name: Replace jQuery tap with randomized touch events')
          start = source.index('        run: |\n', step) + len('        run: |\n')
          end = source.index('\n\n      - name: Verify', start)
          script = textwrap.dedent(source[start:end])
          Path('/tmp/apply-touch-experiment.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-touch-experiment.sh

      - name: Verify
        run: |
          node --check a.js
          node --test test/touch-event-regression.test.mjs

      - name: Commit experiment
        shell: bash
        run: |
          if git diff --quiet -- a.js test/touch-event-regression.test.mjs; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a.js test/touch-event-regression.test.mjs
          git commit -m 'experiment: replace jQuery tap with touch events'
          git push origin HEAD:experiment/touch-events-scroll
