name: Harden Granblue runtime state

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/patch-requests/runtime-state-v50.txt'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: granblue-runtime-state-v50
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/runtime-state-v50'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record runner start
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .github/patch-diagnostics
          printf 'started for %s\n' '${{ github.event.pull_request.head.sha }}' > .github/patch-diagnostics/runtime-state-started.txt
          git add .github/patch-diagnostics/runtime-state-started.txt
          git commit -m 'chore: record runtime state patch runner start'
          git push origin HEAD:main

      - name: Patch and validate
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash -o pipefail <<'RUN' > /tmp/runtime-state-patch.log 2>&1
          set -euo pipefail
          python3 .github/scripts/harden-runtime-state.py
          node --check a.js
          mapfile -d '' test_files < <(find tests test -type f -name '*.test.mjs' -print0 2>/dev/null || true)
          if ((${#test_files[@]})); then
            node --test "${test_files[@]}"
          fi
          RUN
          status=$?
          cat /tmp/runtime-state-patch.log
          exit "$status"

      - name: Record patch failure
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/runtime-state-patch.log .github/patch-diagnostics/runtime-state-error.txt
          git add .github/patch-diagnostics/runtime-state-error.txt
          git commit -m 'chore: record runtime state patch failure'
          git push origin HEAD:main
          exit 1

      - name: Commit generated patch
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-runtime-state.yml
          git rm .github/scripts/harden-runtime-state.py
          git rm .github/patch-diagnostics/runtime-state-started.txt
          rm -f .github/patch-diagnostics/runtime-state-error.txt
          git add -A a.js tests/autoflow.static.test.mjs .github/patch-diagnostics
          git diff --cached --check
          git commit -m 'fix: use Granblue runtime state for battle automation'
          git push origin HEAD:main
