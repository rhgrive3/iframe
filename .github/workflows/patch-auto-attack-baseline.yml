name: Patch auto-attack baseline

on:
  push:
    branches: [fix/auto-attack-baseline-ready]
    paths:
      - .auto-attack-baseline-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/auto-attack-baseline-ready
          fetch-depth: 0

      - name: Patch readiness baseline
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('a.js')
          source = path.read_text(encoding='utf-8')
          replacement = '''  async function waitForAutoAttack(config, context) {
            const { signal } = context;
            await waitForFrameReady({ signal, timeoutMs: config.timeoutSec * 1000, expectedScreen: 'battle' });
            const auto = fullAutoState();
            if (!auto.on) await ensureFullAuto(config, context);

            const armed = await monitorFrame(() => {
              const snapshot = attackSnapshot();
              if (isAttackInProgress(snapshot)) return { snapshot, alreadyAttacking: true };
              const attackReady = snapshot.startVisible && !snapshot.cancelVisible && !snapshot.dummyVisible;
              return attackReady ? { snapshot, alreadyAttacking: false } : false;
            }, {
              signal,
              timeoutMs: config.timeoutSec * 1000,
              stableMs: 0,
              description: 'フルオート攻撃受付待ち'
            });
            if (armed.alreadyAttacking) return armed;

            const baseline = armed.snapshot;
            return monitorFrame(() => {
              const current = attackSnapshot();
              const startReplaced = Boolean(baseline.start && current.start && baseline.start !== current.start);
              const startBecameHidden = baseline.startVisible && !current.startVisible;
              const turnChanged = Boolean(baseline.turn && current.turn && baseline.turn !== current.turn);
              const started = isAttackInProgress(current) || startReplaced || startBecameHidden || turnChanged;
              return started ? { current, startReplaced, startBecameHidden, turnChanged } : false;
            }, { signal, timeoutMs: config.timeoutSec * 1000, stableMs: 0, description: 'フルオート攻撃開始待ち' });
          }'''
          source, count = re.subn(
              r"  async function waitForAutoAttack\(config, context\) \{.*?\n  \}\n\n  async function recoverKnownPopup",
              replacement + "\n\n  async function recoverKnownPopup",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'waitForAutoAttack replacement count: {count}')
          source = source.replace('  const APP_VERSION = 22;', '  const APP_VERSION = 23;', 1)
          path.write_text(source, encoding='utf-8')

      - name: Add regression assertions
        shell: bash
        run: |
          cat >> test/touch-event-regression.test.mjs <<'EOF'

          test('auto-attack establishes a ready baseline before watching for attack', () => {
            assert.match(source, /description: 'フルオート攻撃受付待ち'/);
            assert.match(source, /const attackReady = snapshot\.startVisible && !snapshot\.cancelVisible && !snapshot\.dummyVisible/);
            assert.match(source, /if \(armed\.alreadyAttacking\) return armed/);
            assert.match(source, /const baseline = armed\.snapshot/);
          });
          EOF

      - name: Verify
        run: |
          node --check a.js
          node --test test/touch-event-regression.test.mjs

      - name: Remove one-shot files and commit
        shell: bash
        run: |
          rm -f .auto-attack-baseline-trigger .github/workflows/patch-auto-attack-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: arm auto-attack wait after attack controls are ready'
          git push origin HEAD:fix/auto-attack-baseline-ready
