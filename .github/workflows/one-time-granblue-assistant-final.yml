name: One-time Granblue assistant final polish

on:
  push:
    branches: [main]
    paths:
      - .trigger-granblue-assistant-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final polish
        run: python3 .github/scripts/granblue_assistant_final.py
      - name: Validate final product
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs
          grep -q "savedInitial==='about:blank'?location.href:savedInitial" a.js
          grep -q "state.activeTab==='condition')requestAnimationFrame(refreshGranblueAssistant" a.js
      - name: Commit and remove one-time files
        run: |
          rm -rf .github/scripts/__pycache__
          rm -f .trigger-granblue-assistant-final
          rm -f .github/scripts/granblue_assistant_final.py
          rm -f .github/workflows/one-time-granblue-assistant-final.yml
          rm -f .github/workflows/one-time-granblue-assistant-final-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize Granblue assistant initial state"
          git push origin HEAD:main
