name: Apply iframe autoclicker bundle

on:
  push:
    paths:
      - '.tmp/iframe-autoclicker-ready'
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.tmp/iframe-autoclicker-pr-ready'

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify a.js
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/a.js.gz.b64.* | base64 --decode | gzip --decompress > a.js.new
          echo 'bd3073e6bb68dcb273974d6cbc8987e2ef0cb395fc61779bdd535c18867ca4be  a.js.new' | sha256sum --check --strict
          mv a.js.new a.js
          rm -rf .tmp
      - name: Commit a.js
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Scratch-style Granblue autoflow editor'
          git push origin HEAD:main
