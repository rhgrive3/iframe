name: Apply touch scroll refactor

on:
  push:
    branches:
      - refactor/truncated-touch-scroll-sync

permissions:
  contents: write

concurrency:
  group: apply-touch-scroll-refactor
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/truncated-touch-scroll-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply refactor
        run: python .github/scripts/apply_touch_refactor.py
      - name: Validate JavaScript and regression tests
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: synchronize synthetic touch and scroll physics'
          git push origin HEAD:refactor/truncated-touch-scroll-sync
