# One-shot bridge; removed after successful branch generation.
name: Professional UX patch bridge

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-professional-ux-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/professional-controller-v2
          fetch-depth: 0

      - name: Reset onto runtime latest main
        shell: bash
        run: |
          git fetch origin main ux/professional-controller
          git reset --hard origin/main

      - name: Build and apply reviewed UX patch
        shell: bash
        run: |
          git diff b930710be0f6ef908bc0a55ed4119a5d502f3ef7..origin/ux/professional-controller -- \
            a.js tests/safari-performance-regression.test.mjs > /tmp/ux.patch
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('a.js').read_text(encoding='utf-8')
          match = re.search(r'const APP_VERSION = (\d+);', source)
          if not match:
              raise SystemExit('APP_VERSION marker not found')
          current = int(match.group(1))
          patch_path = Path('/tmp/ux.patch')
          patch = patch_path.read_text(encoding='utf-8')
          old = "-  const APP_VERSION = 38;\n+  const APP_VERSION = 39;"
          new = f"-  const APP_VERSION = {current};\n+  const APP_VERSION = {current + 1};"
          if patch.count(old) != 1:
              raise SystemExit(f'expected one version hunk, found {patch.count(old)}')
          patch_path.write_text(patch.replace(old, new, 1), encoding='utf-8')
          PY
          git apply --reject --whitespace=fix /tmp/ux.patch

      - name: Add current UX regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/autoflow.static.test.mjs')
          source = path.read_text(encoding='utf-8')
          marker = "test('professional UX exposes truthful runtime and accessible recovery state'"
          if marker not in source:
              source += """

test('professional UX exposes truthful runtime and accessible recovery state', () => {
  assert.match(source, /const APP_VERSION = \d+/);
  assert.ok(source.includes('function syncRunControls()'));
  assert.ok(source.includes("compactRun.textContent = isRunning ? '■' : '▶'"));
  assert.ok(source.includes("compactRun.classList.toggle('is-stop', isRunning)"));
  assert.ok(source.includes("dock.setAttribute('aria-busy', String(isRunning))"));
  assert.ok(source.includes('role="tablist"'));
  assert.ok(source.includes('aria-selected="true"'));
  assert.ok(source.includes("button.setAttribute('aria-selected', String(active))"));
  assert.ok(source.includes('section.hidden = !active'));
  assert.ok(source.includes('id="workflowErrorRetry"'));
  assert.ok(source.includes("setAutosaveStatus('saving')"));
  assert.ok(source.includes("if (mode === 'replace' && workflow.blocks.length"));
});
"""
              path.write_text(source, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check a.js
          mapfile -d '' test_files < <(find tests test -type f -name '*.test.mjs' -print0 2>/dev/null || true)
          if ((${#test_files[@]})); then
            node --test "${test_files[@]}"
          fi

      - name: Commit generated branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-professional-ux-bridge.yml
          git add a.js tests/autoflow.static.test.mjs tests/safari-performance-regression.test.mjs
          git commit -m 'feat: professionalize controller UX'
          git push --force origin HEAD:ux/professional-controller-v2
