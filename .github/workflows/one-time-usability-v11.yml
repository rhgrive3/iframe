name: One-time usability v11 patch

on:
  push:
    branches:
      - ux/mobile-usability-v11
    paths:
      - .trigger-usability-v11

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply usability patch
        run: python3 .github/scripts/improve_usability_v11.py

      - name: Validate JavaScript and required behavior
        run: |
          node --check a.js
          grep -q "state_v11" a.js
          grep -q "function viewportBox" a.js
          grep -q "keyboardOpen" a.js
          grep -q "font-size:16px!important" a.js
          grep -q "setConditionTargetSummary" a.js
          grep -q "revealEditor('condition')" a.js
          ! grep -q "text.innerHTML=.*conditionTypeLabel" a.js

      - name: Commit patched source and remove one-time files
        run: |
          rm -f .trigger-usability-v11
          rm -f .github/scripts/improve_usability_v11.py
          rm -f .github/workflows/one-time-usability-v11.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: improve mobile usability and keyboard handling"
          git push
