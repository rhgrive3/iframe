name: Apply autoclicker UI drag fix PR

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'tools/apply_ui_drag_fix.py'
      - '.tmp/apply-ui-drag-fix-pr'

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_ui_drag_fix.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/ui-drag-regression.test.mjs')
          source = path.read_text()
          old = "  assert.match(source, /touchmove', suppressNativeDrag, \\{ capture: true, passive: false \\}/);"
          new = "  assert.match(source, /\\['touchmove', 'gesturestart', 'gesturechange'\\]/);\n  assert.match(source, /window\\.addEventListener\\(type, suppressNativeDrag, \\{ capture: true, passive: false \\}\\)/);"
          if old not in source:
              raise SystemExit('touch drag assertion anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check a.js
          node --test tests/ui-drag-regression.test.mjs
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_ui_drag_fix.py
          rm -f .tmp/apply-ui-drag-fix .tmp/apply-ui-drag-fix-pr
          rm -f .github/workflows/apply-ui-drag-fix.yml
          rmdir tools .tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize autoclicker UI dragging on touch devices'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
