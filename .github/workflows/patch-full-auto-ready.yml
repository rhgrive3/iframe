name: Patch full-auto readiness

on:
  push:
    branches:
      - experiment/touch-events-scroll

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/touch-events-scroll
          fetch-depth: 0

      - name: Patch readiness condition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('a.js')
          source = path.read_text(encoding='utf-8')
          old = """  async function ensureFullAuto(config, context) {
    const { signal } = context;
    await waitForFrameReady({ signal, timeoutMs: config.timeoutSec * 1000, expectedScreen: 'battle' });
    const found = await monitorFrame(() => {
      const observed = fullAutoState();
      return observed.exists && observed.visible ? observed : false;
    }, { signal, timeoutMs: config.timeoutSec * 1000, description: 'フルオートボタン待ち' });
    if (found.on) return { changed: false };
    await jqTapStrict(found.button, { signal, label: 'フルオート' });
    return { changed: true };
  }
"""
          new = """  async function ensureFullAuto(config, context) {
    const { signal } = context;
    await waitForFrameReady({ signal, timeoutMs: config.timeoutSec * 1000, expectedScreen: 'battle' });
    const found = await monitorFrame(() => {
      const doc = frameDocument();
      const observed = fullAutoState(doc);
      const attack = attackSnapshot(doc);
      const inputReady = attack.startVisible && !attack.dummyVisible && !attack.cancelVisible;
      return observed.exists && observed.visible && inputReady ? observed : false;
    }, {
      signal,
      timeoutMs: config.timeoutSec * 1000,
      stableMs: DEFAULT_STABLE_MS,
      description: 'フルオート操作可能状態待ち'
    });
    if (found.on) return { changed: false };
    await jqTapStrict(found.button, { signal, label: 'フルオート' });
    return { changed: true };
  }
"""
          if old not in source:
              raise SystemExit('target ensureFullAuto block not found; refusing unsafe patch')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate syntax and tests
        shell: bash
        run: |
          node --check a.js
          if [ -f test/touch-event-regression.test.mjs ]; then
            node --test test/touch-event-regression.test.mjs
          fi

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-full-auto-ready.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a.js .github/workflows/patch-full-auto-ready.yml
          git commit -m "fix: wait for battle input before enabling full auto"
          git push origin HEAD:experiment/touch-events-scroll
