name: Validate Auto Flow

on:
  pull_request:
    paths:
      - a.js
      - test/**
      - tests/**
      - .github/workflows/validate-autoflow.yml
  push:
    branches: [main]
    paths:
      - a.js
      - test/**
      - tests/**
      - .github/workflows/validate-autoflow.yml
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: autoflow-validation-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  patch-auto-attack-race:
    if: github.event_name == 'issues' && github.event.issue.title == 'run-auto-attack-toggle-race-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch monitor ordering
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('a.js')
          source = path.read_text(encoding='utf-8')
          replacement = '''  async function waitForAutoAttack(config, context) {
            const { signal } = context;
            await waitForFrameReady({ signal, timeoutMs: config.timeoutSec * 1000, expectedScreen: 'battle' });

            const initial = attackSnapshot();
            if (isAttackInProgress(initial)) return { alreadyAttacking: true, snapshot: initial };

            const attackStarted = monitorFrame(() => {
              const current = attackSnapshot();
              const started = isAttackInProgress(current)
                || (initial.startVisible && !current.startVisible)
                || Boolean(initial.start && current.start && initial.start !== current.start)
                || Boolean(initial.turn && current.turn && initial.turn !== current.turn);
              return started ? { current } : false;
            }, {
              signal,
              timeoutMs: config.timeoutSec * 1000,
              stableMs: 0,
              description: 'フルオート攻撃開始待ち'
            });

            const auto = fullAutoState();
            if (!auto.on) {
              await ensureFullAuto(config, context);
            }

            return attackStarted;
          }
'''
          source, count = re.subn(
              r"  async function waitForAutoAttack\(config, context\) \{.*?\n  \}\n\n  async function recoverKnownPopup",
              replacement + "\n  async function recoverKnownPopup",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'waitForAutoAttack replacement count: {count}')
          match = re.search(r"  const APP_VERSION = (\d+);", source)
          if not match:
              raise SystemExit('APP_VERSION not found')
          source = source[:match.start()] + f"  const APP_VERSION = {int(match.group(1)) + 1};" + source[match.end():]
          path.write_text(source, encoding='utf-8')

      - name: Add regression test
        shell: bash
        run: |
          cat >> test/touch-event-regression.test.mjs <<'EOF'

          test('auto attack monitoring starts before enabling full auto', () => {
            const fnStart = source.indexOf('async function waitForAutoAttack');
            const fnEnd = source.indexOf('async function recoverKnownPopup', fnStart);
            const body = source.slice(fnStart, fnEnd);
            const monitorIndex = body.indexOf('const attackStarted = monitorFrame');
            const ensureIndex = body.indexOf('await ensureFullAuto(config, context)');
            assert.ok(monitorIndex >= 0);
            assert.ok(ensureIndex >= 0);
            assert.ok(monitorIndex < ensureIndex);
            assert.match(body, /return attackStarted/);
          });
          EOF
      - name: Verify
        run: |
          node --check a.js
          node --test test/touch-event-regression.test.mjs
      - name: Restore workflow and commit
        shell: bash
        run: |
          rm -f .auto-attack-race-trigger
          cat > .github/workflows/validate-autoflow.yml <<'EOF'
          name: Validate Auto Flow

          on:
            pull_request:
              paths:
                - a.js
                - test/**
                - tests/**
                - .github/workflows/validate-autoflow.yml
            push:
              branches: [main]
              paths:
                - a.js
                - test/**
                - tests/**
                - .github/workflows/validate-autoflow.yml

          permissions:
            contents: read

          concurrency:
            group: autoflow-validation-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: JavaScript syntax
                  run: node --check a.js
                - name: Regression checks
                  run: node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: observe auto attack before enabling full auto'
          git push origin HEAD:main

  validate:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check a.js
      - name: Regression checks
        run: node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs
