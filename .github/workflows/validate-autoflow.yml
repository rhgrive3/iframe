name: Apply Touch Consistency Patch

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-touch-consistency-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'experiment/touch-consistency-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body "touch consistency finalizer started at base ${{ github.sha }}"
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize exact movement invariant
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/scripts/apply_touch_consistency.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('  const TOUCH_MOVE_THRESHOLD_PX = 0.1;\n', '')
          source = source.replace('if (movement >= TOUCH_MOVE_THRESHOLD_PX) {', 'if (movement > Number.EPSILON) {')
          source = source.replace('assert.match(source, /movement >= TOUCH_MOVE_THRESHOLD_PX/);', 'assert.match(source, /movement > Number\\.EPSILON/);')
          path.write_text(source, encoding='utf-8')
      - name: Apply patch
        run: python .github/scripts/apply_touch_consistency.py
      - name: Verify
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs
      - name: Reject stale main and commit final changes
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make synthetic touch gestures statistically coherent'
          git push origin HEAD:main
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body "touch consistency finalizer finished with status: ${{ job.status }}"
