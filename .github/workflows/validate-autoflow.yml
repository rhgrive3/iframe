name: Apply Touch Consistency Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-autoflow.yml
      - .github/scripts/apply_touch_consistency.py
      - .github/workflows/apply-touch-consistency.yml

permissions:
  contents: write

concurrency:
  group: apply-touch-consistency-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize exact movement invariant
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/scripts/apply_touch_consistency.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('  const TOUCH_MOVE_THRESHOLD_PX = 0.1;\n', '')
          source = source.replace('if (movement >= TOUCH_MOVE_THRESHOLD_PX) {', 'if (movement > Number.EPSILON) {')
          source = source.replace('assert.match(source, /movement >= TOUCH_MOVE_THRESHOLD_PX/);', 'assert.match(source, /movement > Number\\.EPSILON/);')
          path.write_text(source, encoding='utf-8')
      - name: Apply patch
        run: python .github/scripts/apply_touch_consistency.py
      - name: Verify
        run: |
          node --check a.js
          node --test tests/autoflow.static.test.mjs test/touch-event-regression.test.mjs
      - name: Commit final changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make synthetic touch gestures statistically coherent'
          git push origin HEAD:main
